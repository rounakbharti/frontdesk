global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "local-dev"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "agent-service"
    static_configs:
      - targets: ["host.docker.internal:4001"]
    metrics_path: /metrics

  - job_name: "help-request-service"
    static_configs:
      - targets: ["host.docker.internal:4002"]
    metrics_path: /metrics

  - job_name: "nlu-adapter"
    static_configs:
      - targets: ["host.docker.internal:4003"]
    metrics_path: /metrics

  - job_name: "notification-service"
    static_configs:
      - targets: ["host.docker.internal:4004"]
    metrics_path: /metrics

  - job_name: "kb-service"
    static_configs:
      - targets: ["host.docker.internal:4005"]
    metrics_path: /metrics

  - job_name: "kb-indexer-worker"
    static_configs:
      - targets: ["host.docker.internal:4006"]
    metrics_path: /metrics

  - job_name: "timeout-worker"
    static_configs:
      - targets: ["host.docker.internal:4007"]
    metrics_path: /metrics

  - job_name: "audit-worker"
    static_configs:
      - targets: ["host.docker.internal:4008"]
    metrics_path: /metrics
