name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint + typecheck all TypeScript workspaces
  # ─────────────────────────────────────────────────────────────
  lint-ts:
    name: Lint & Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -F @frontdesk/types -F @frontdesk/observability build

      - name: Typecheck all workspaces
        run: pnpm --filter '!@frontdesk/nlu-adapter' -r typecheck

      - name: Lint (root-level ESLint across all services)
        run: pnpm lint

  # ─────────────────────────────────────────────────────────────
  # Lint Python (NLU adapter)
  # ─────────────────────────────────────────────────────────────
  lint-py:
    name: Lint (Python / NLU Adapter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nlu-adapter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Run ruff (lint)
        run: ruff check src/

      - name: Run mypy (type check)
        run: mypy src/ --ignore-missing-imports || true

  # ─────────────────────────────────────────────────────────────
  # Unit tests — mock NLU only, no model downloads, no Docker
  # ─────────────────────────────────────────────────────────────
  unit-tests-ts:
    name: Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: [lint-ts]
    env:
      NLU_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -F @frontdesk/types -F @frontdesk/observability build

      - name: Run unit tests
        run: pnpm --filter '!@frontdesk/nlu-adapter' -r test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ts
          path: "**/coverage/"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Unit tests — Python NLU adapter (mock mode, no model download)
  # ─────────────────────────────────────────────────────────────
  unit-tests-py:
    name: Unit Tests (Python / NLU Adapter)
    runs-on: ubuntu-latest
    needs: [lint-py]
    defaults:
      run:
        working-directory: services/nlu-adapter
    env:
      NLU_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (no model download)
        run: pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short || true

  # ─────────────────────────────────────────────────────────────
  # Build verification — ensure all TS services compile
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    needs: [unit-tests-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -F @frontdesk/types -F @frontdesk/observability build

      - name: Build all TS workspaces
        run: pnpm --filter '!@frontdesk/nlu-adapter' --filter '!@frontdesk/supervisor-ui' -r build

      - name: Build supervisor-ui (Next.js)
        run: pnpm --filter '@frontdesk/supervisor-ui' build
