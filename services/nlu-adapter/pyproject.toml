[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontdesk-nlu-adapter"
version = "0.1.0"
description = "NLU Adapter — FastAPI service with mock NLU and optional sentence-transformers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.2.1",
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "scikit-learn>=1.3.0",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.24.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.5",
    "httpx==0.27.0",
    "ruff==0.3.2",
    "mypy==1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "N", "S", "B", "A"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
